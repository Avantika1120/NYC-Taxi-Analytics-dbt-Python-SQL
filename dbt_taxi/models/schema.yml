version: 2

models:
  - name: stg_yellow_trips
    description: Cleaned and standardized Yellow Taxi trip records.
    columns:
      - name: trip_id
        tests: [not_null, unique]
      - name: pickup_datetime
        tests: [not_null]
      - name: dropoff_datetime
        tests: [not_null]
      - name: payment_type
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]
      - name: pickup_location_id
        tests: [not_null]
      - name: dropoff_location_id
        tests: [not_null]

  - name: stg_taxi_zones
    description: Cleaned taxi zone dimension source.
    columns:
      - name: location_id
        tests: [not_null, unique]
      - name: borough
        tests: [not_null]
      - name: zone
        tests: [not_null]

  - name: int_trips_enriched
    description: Trip records enriched with zone names, time features, efficiency metrics, and quality flags.
    columns:
      - name: trip_id
        tests: [not_null, unique]
      - name: trip_duration_minutes
        tests: [not_null]

  - name: dim_zones
    description: Final taxi-zone dimension for analytics.
    columns:
      - name: location_id
        tests: [not_null, unique]

  - name: fct_trips
    description: Incremental trip-level fact table used by downstream marts and the dashboard.
    columns:
      - name: trip_id
        tests: [not_null, unique]
      - name: pickup_location_id
        tests:
          - relationships:
              to: ref('dim_zones')
              field: location_id
      - name: dropoff_location_id
        tests:
          - relationships:
              to: ref('dim_zones')
              field: location_id

  - name: mart_daily_kpis
    description: Daily executive KPI table.
    columns:
      - name: pickup_date
        tests: [not_null, unique]
      - name: total_trips
        tests: [not_null]
      - name: total_revenue
        tests: [not_null]

  - name: mart_zone_performance
    description: Pickup-zone performance table for demand, revenue, tips, and efficiency.
    columns:
      - name: location_id
        tests: [not_null, unique]

  - name: mart_hourly_demand
    description: Demand and revenue profile by weekday and hour.
